<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0473ea" />
    <title>Offline — KQ-SOFT</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        padding-bottom: max(2rem, env(safe-area-inset-bottom));
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        padding: 1.75rem 1.5rem;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #475569;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        min-height: 44px;
        border: none;
        border-radius: 0.75rem;
        background: #0473ea;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.9;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        margin: 0 auto 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/pwa-icon-192.png" width="48" height="48" alt="" />
      <h1>You&rsquo;re offline</h1>
      <p>
        KQ-SOFT needs a connection to load live projects and save matches. Check your network, then try
        again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
